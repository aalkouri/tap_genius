name: Android build -> APK + AAB
# Manual: Actions tab -> "Android build -> APK + AAB" -> Run workflow. Wraps https://tap.alkouri.com with Bubblewrap (TWA).
# Output: downloadable artifacts "tap-genius-apk" (sideload) and "tap-genius-aab" (Play Store). Does not touch the game server.
# Optional secrets for a stable signing key (required for Play): ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS. See android/README.md.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Bubblewrap config (use runner's JDK + Android SDK)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
      - name: Signing key
        run: |
          W="$RUNNER_TEMP/twa"; mkdir -p "$W"; cp android/twa-manifest.json "$W/"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$W/android.keystore"; ALIAS="$KS_ALIAS"; PASS="$KS_PASS"
            echo "Using your keystore from repo secrets."
          else
            ALIAS=tapgenius; PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$W/android.keystore" -alias "$ALIAS" -storepass "$PASS" -keypass "$PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tap Genius"
            echo "::warning::No keystore secrets set: built with a THROWAWAY key. Fine for sideloading; do not upload to Play."
          fi
          echo "::add-mask::$PASS"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          jq --arg a "$ALIAS" --argjson c "${{ github.run_number }}" --arg v "1.0.${{ github.run_number }}" \
            '.signingKey.alias=$a | .appVersionCode=$c | .appVersionName=$v' "$W/twa-manifest.json" > "$W/t.json" && mv "$W/t.json" "$W/twa-manifest.json"
          echo "W=$W" >> "$GITHUB_ENV"
          echo "== SHA-256 fingerprint (put this in public/.well-known/assetlinks.json) =="
          keytool -list -v -keystore "$W/android.keystore" -alias "$ALIAS" -storepass "$PASS" | grep 'SHA256:'
      - name: Generate + build
        working-directory: ${{ env.W }}
        run: |
          npx -y @bubblewrap/cli@1 update --skipVersionUpgrade --manifest=twa-manifest.json
          npx -y @bubblewrap/cli@1 build --skipPwaValidation --manifest=twa-manifest.json
          ls -la *.apk *.aab
      - uses: actions/upload-artifact@v4
        with: { name: tap-genius-apk, path: "${{ env.W }}/app-release-signed.apk" }
      - uses: actions/upload-artifact@v4
        with: { name: tap-genius-aab, path: "${{ env.W }}/app-release-bundle.aab" }
