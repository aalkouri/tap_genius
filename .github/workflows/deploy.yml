name: Deploy to game server
# Pushing to main (or a claude/* branch) deploys that exact commit to the EC2 game server.
# Auth is keyless (GitHub OIDC -> a narrow AWS role); no secrets are stored in GitHub.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  AWS_REGION: us-west-1
  INSTANCE_ID: i-00966cc1ee771d0cc   # shared with girl_game (Island Night)
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check server.js && node --check public/app.js
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::405433667541:role/tap-genius-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy over SSM
        env:
          GH_TOKEN: ${{ github.token }}   # short-lived, read-only; lets the instance fetch this private repo
        run: |
          SHA="${GITHUB_SHA}"
          cat > cmd.sh <<EOF
          set -euo pipefail
          W=\$(mktemp -d); cd "\$W"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${SHA}" -o src.tgz
          mkdir src && tar xzf src.tgz -C src --strip-components=1
          cd src
          mkdir -p /opt/tap-genius; rm -rf /opt/tap-genius/public
          rm -rf /opt/tap-genius/questions; cp -r server.js questions package.json package-lock.json public /opt/tap-genius/
          cd /opt/tap-genius && (npm ci --omit=dev || npm install --omit=dev)
          systemctl restart tap-genius
          sleep 3
          systemctl is-active tap-genius
          curl -fsS http://localhost:8081/healthz >/dev/null
          echo "deployed ${SHA}"
          EOF
          sed -i 's/^          //' cmd.sh
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters "commands=$(python3 -c 'import json;print(json.dumps(open("cmd.sh").read().split("\n")))')" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output text
          [ "$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)" = "Success" ]
